name: Skill & Plugin Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  validate:
    name: Validate Skills & Plugin Manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate skills and agent personas (Node.js)
        run: node scripts/validate-skills.js

      - name: Validate plugin & marketplace manifest versions (Node.js)
        run: node scripts/validate-versions.js

      - name: Validate command parity across Claude, Gemini, and Antigravity
        run: node scripts/validate-commands.js

      - name: Validate YAML frontmatter & JSON manifests (Python)
        run: |
          python3 << 'EOF'
          import yaml
          import json
          import sys
          import os

          skills = ['frappe-docs', 'frappe-course-generator']
          errors = []

          for skill in skills:
              path = f'skills/{skill}/SKILL.md'
              if not os.path.exists(path):
                  errors.append(f'{path}: file not found')
                  continue

              with open(path, encoding='utf-8-sig') as f:
                  content = f.read()

              parts = content.split('---', 2)
              if len(parts) < 3:
                  errors.append(f'{path}: no YAML frontmatter found')
                  continue

              try:
                  data = yaml.safe_load(parts[1])
                  if not data.get('name'):
                      errors.append(f'{path}: missing "name" field')
                  elif data['name'] != skill:
                      errors.append(f'{path}: name "{data["name"]}" does not match folder "{skill}"')

                  if not data.get('description'):
                      errors.append(f'{path}: missing "description" field')
                  elif len(data['description']) > 1024:
                      errors.append(f'{path}: description too long ({len(data["description"])} > 1024 chars)')

                  print(f'OK {skill}: name={data.get("name")}, description={len(data.get("description", ""))} chars')
              except yaml.YAMLError as e:
                  errors.append(f'{path}: YAML error: {e}')

          manifests = [
              'plugin.json',
              'skills.json',
              '.claude-plugin/plugin.json',
              '.claude-plugin/marketplace.json',
              '.codex-plugin/plugin.json',
              '.agents/plugins/marketplace.json',
          ]
          for m in manifests:
              if not os.path.exists(m):
                  errors.append(f'{m}: not found')
                  continue
              with open(m, 'rb') as bf:
                  raw = bf.read()
              if raw.startswith(b'\xef\xbb\xbf'):
                  errors.append(f'{m}: contains UTF-8 BOM')
              with open(m, encoding='utf-8-sig') as f:
                  json.load(f)
              print(f'OK {m}: valid JSON (no BOM)')

          if errors:
              print('\nValidation failed:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          else:
              print('\nAll validations passed!')
          EOF

      - name: Check file structure
        run: |
          for file in README.md LICENSE CHANGELOG.md CONTRIBUTING.md CLAUDE.md AGENTS.md GEMINI.md plugin.json skills.json; do
              if [ ! -f "$file" ]; then
                  echo "Missing: $file"
                  exit 1
              fi
          done

          for skill in frappe-docs frappe-course-generator; do
              if [ ! -f "skills/$skill/SKILL.md" ]; then
                  echo "Missing SKILL.md in: skills/$skill"
                  exit 1
              fi
          done
          echo "File structure OK"

      - name: Test installers syntax
        run: |
          bash -n install.sh
          python3 -c "import ast; ast.parse(open('install.py', encoding='utf-8-sig').read()); print('install.py syntax OK')"
          echo "install.sh and install.py syntax OK"

      - name: Test Python scripts in frappe-course-generator
        run: |
          cd skills/frappe-course-generator/scripts
          python3 -c "import ast; ast.parse(open('scaffold_course.py', encoding='utf-8-sig').read()); print('scaffold_course.py syntax OK')"
          python3 -c "import ast; ast.parse(open('build_course.py', encoding='utf-8-sig').read()); print('build_course.py syntax OK')"
          python3 -c "import ast; ast.parse(open('verify_course.py', encoding='utf-8-sig').read()); print('verify_course.py syntax OK')"

      - name: Test course generator CLI and scaffolding
        run: |
          cd skills/frappe-course-generator/scripts
          python3 scaffold_course.py --help > /dev/null
          python3 build_course.py --help > /dev/null
          python3 verify_course.py --help > /dev/null
          python3 scaffold_course.py \
              --name "ci-test" \
              --track developer \
              --audience developers \
              --language ar \
              --length quick \
              --with-project \
              --output /tmp/ci-test-course
          test -f /tmp/ci-test-course/README.md
          test -d /tmp/ci-test-course/modules
          echo "Course generator scripts run and scaffold successfully"

  validate-platforms:
    name: Validate Tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run validators
        run: |
          node scripts/validate-skills.js
          node scripts/validate-versions.js
          node scripts/validate-commands.js
