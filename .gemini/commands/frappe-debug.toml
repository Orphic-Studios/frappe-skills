description = "Diagnose and fix Frappe Framework, ERPNext, bench CLI, MariaDB, Redis, or worker errors systematically."

prompt = """
Invoke the frappe-docs skill and consult `skills/frappe-docs/references/troubleshooting.md` alongside `skills/frappe-docs/references/framework/bench-cli.md`.

## Process

1. Analyze the traceback, error message, or symptom in the user's request.
2. Match against known failure categories:
   - Database & Migrations: `OperationalError`, `Unknown column`, `DuplicateEntryError`, lock wait timeouts, collation mismatches.
   - Permissions & Document Lifecycle: `PermissionError`, `ValidationError`, `LinkValidationError`, `UpdateAfterSubmitError`, recursive `on_update` saves.
   - Bench, Workers & Assets: Redis `ConnectionError`, RQ worker stalls, `502 Bad Gateway`, `504 Gateway Timeout`, `bench build` / Node version mismatches, `wkhtmltopdf` failures.
3. Provide:
   - Root Cause: Why the error happened in the Frappe lifecycle.
   - Immediate Fix: Exact code change or `bench` CLI command to resolve it safely.
   - Verification: How to confirm the fix worked without side effects.
"""
